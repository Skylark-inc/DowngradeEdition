<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skylark Downgrade</title>

<link rel="icon" href="https://endlesspete.github.io/Medotdev/BBA22EA1-962D-44D9-B632-3E823FF06445.png">
<link rel="apple-touch-icon" href="https://endlesspete.github.io/Medotdev/BBA22EA1-962D-44D9-B632-3E823FF06445.png">

<style>
:root {
  color-scheme: light dark;
  --bg: #f5f5f7;
  --card: rgba(255,255,255,.84);
  --text: #1c1c1e;
  --muted: #6e6e73;
  --border: rgba(0,0,0,.08);
  --accent: #007aff;
  --danger: #ff3b30;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09090b;
    --card: rgba(28,28,30,.8);
    --text: #f2f2f7;
    --muted: #a1a1aa;
    --border: rgba(255,255,255,.1);
    --accent: #6aa9ff;
    --danger: #ff6961;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 22px;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at top, rgba(0,122,255,.16), transparent 42%),
    var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
}

.container {
  width: 100%;
  max-width: 430px;
}

.hero {
  text-align: center;
  margin-bottom: 22px;
}

.hero-title {
  margin: 0;
  font-size: 3rem;
  font-weight: 850;
  letter-spacing: -2px;
  line-height: .95;
  background: linear-gradient(180deg, #007aff, #003e8a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-subtitle {
  margin-top: 12px;
  color: var(--muted);
  font-size: .98rem;
  line-height: 1.45;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 34px;
  padding: 28px 24px;
  text-align: center;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 18px 45px rgba(0,0,0,.16);
}

.badge {
  display: inline-flex;
  padding: 7px 14px;
  border-radius: 999px;
  background: rgba(0,122,255,.13);
  color: var(--accent);
  font-size: .78rem;
  font-weight: 800;
  margin-bottom: 18px;
}

.title {
  font-size: 1.7rem;
  font-weight: 850;
  letter-spacing: -.8px;
  line-height: 1.15;
}

.version {
  margin-top: 12px;
  color: var(--muted);
  line-height: 1.45;
}

select {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 1rem;
}

.button {
  display: block;
  margin-top: 18px;
  width: 100%;
  border-radius: 18px;
  padding: 16px 18px;
  background: var(--accent);
  color: white;
  font-size: 1rem;
  font-weight: 750;
  text-decoration: none;
}

.button.disabled {
  opacity: .45;
  pointer-events: none;
  background: #8e8e93;
}

.small {
  margin-top: 16px;
  font-size: .84rem;
  color: var(--muted);
  line-height: 1.5;
}

.small a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}

.error {
  margin-top: 16px;
  color: var(--danger);
  font-size: .9rem;
  font-weight: 650;
  line-height: 1.45;
}

.footer {
  margin-top: 26px;
  text-align: center;
  font-size: .82rem;
  color: var(--muted);
  line-height: 1.8;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">
  <div class="hero">
    <h1 class="hero-title">Skylark Downgrade</h1>
    <div class="hero-subtitle">
      Choose an earlier Skylark edition for your device.
    </div>
  </div>

  <div class="card">
    <div class="badge" id="badge">Checking Device</div>
    <div class="title" id="title">Finding your supported edition...</div>
    <div class="version" id="version">Please wait while Skylark checks compatibility.</div>

    <div id="selectorWrap" style="display:none;">
      <select id="editionSelect">
        <option value="">Choose an edition</option>
      </select>
    </div>

    <a id="button" class="button disabled" href="#">Checking</a>

    <div class="small" id="small">Loading edition data...</div>
    <div class="error" id="error"></div>
  </div>

  <div class="footer">
    <a href="https://x.com/Useskylark" target="_blank">@UseSkylark</a>
    <br>
    <a href="https://x.com/endlesspeteinc" target="_blank">@Endlesspeteinc</a>
  </div>
</div>

<script>
const EDITIONS_URL = "/editions.json";

const ua = navigator.userAgent;

const isApple =
  /iPhone|iPad|Macintosh/.test(ua) &&
  !/Android|Windows|Linux/.test(ua);

let iosVersion = null;

const osMatch = ua.match(/OS (\d+)[._](\d+)/);
const versionMatch = ua.match(/Version\/(\d+)\.(\d+)/);

if (osMatch) {
  iosVersion = {
    major: Number(osMatch[1]),
    minor: Number(osMatch[2]),
    text: `${osMatch[1]}.${osMatch[2]}`
  };
}

/* iOS 26+ Safari fix */
if (versionMatch && iosVersion) {
  const safariMajor = Number(versionMatch[1]);
  const safariMinor = Number(versionMatch[2]);

  if (safariMajor >= 26 && iosVersion.major <= 18) {
    iosVersion = {
      major: safariMajor,
      minor: safariMinor,
      text: `${safariMajor}.${safariMinor}`
    };
  }
}

const badge = document.getElementById("badge");
const title = document.getElementById("title");
const version = document.getElementById("version");
const selectorWrap = document.getElementById("selectorWrap");
const editionSelect = document.getElementById("editionSelect");
const button = document.getElementById("button");
const small = document.getElementById("small");
const error = document.getElementById("error");

function versionToParts(value) {
  const text = String(value).replace("iOS", "").trim();
  const parts = text.split(".");
  return {
    major: Number(parts[0] || 0),
    minor: Number(parts[1] || 0)
  };
}

function compareVersions(a, b) {
  if (a.major !== b.major) return a.major - b.major;
  return a.minor - b.minor;
}

function editionNumber(item) {
  const name = item.edition || item.name || "";
  const match = String(name).match(/\d+/);
  return match ? Number(match[0]) : 0;
}

function getEditionName(item) {
  return item.edition || item.name || `Edition ${editionNumber(item)}`;
}

function getEditionLink(item) {
  return item.link || item.url || item.download || item.downloadURL || "";
}

function getMinVersion(item) {
  return versionToParts(item.min || item.minimum || item.minIOS || item.minimumIOS);
}

function getMaxVersion(item) {
  return versionToParts(item.max || item.maximum || item.maxIOS || item.maximumIOS);
}

function isDownloadable(item) {
  const status = String(item.status || item.support || "").toLowerCase();
  const link = getEditionLink(item);

  if (!link) return false;
  if (item.available === false) return false;
  if (item.downloadable === false) return false;
  if (status.includes("development")) return false;
  if (status.includes("unreleased")) return false;
  if (status.includes("not available")) return false;

  return true;
}

function stopPage(status, heading, subtext, note) {
  badge.textContent = status;
  title.textContent = heading;
  version.textContent = subtext;
  button.textContent = "Unavailable";
  button.classList.add("disabled");
  button.removeAttribute("href");
  selectorWrap.style.display = "none";
  small.innerHTML = `
    Contact <a href="https://x.com/skylarksupport" target="_blank">@SkylarkSupport</a>
    if you believe this is an issue.
  `;
  error.textContent = note;
}

function setButton(text, link, disabled = false) {
  button.textContent = text;

  if (disabled || !link) {
    button.classList.add("disabled");
    button.removeAttribute("href");
  } else {
    button.classList.remove("disabled");
    button.href = link;
  }
}

async function start() {
  if (!isApple) {
    stopPage(
      "Unsupported Device",
      "Skylark is designed for Apple devices",
      "Use an iPhone, iPad, or supported Apple device.",
      "Android, Windows, and Linux devices are not supported."
    );
    return;
  }

  if (!iosVersion) {
    stopPage(
      "Version Not Detected",
      "Skylark could not read your iOS version",
      "Open this page in Safari on your Apple device.",
      "Unable to identify your iOS version."
    );
    return;
  }

  let data;

  try {
    const response = await fetch(EDITIONS_URL, { cache: "no-store" });

    if (!response.ok) {
      throw new Error("Unable to load editions.json");
    }

    data = await response.json();
  } catch (err) {
    stopPage(
      "Edition Data Unavailable",
      "Skylark could not load edition data",
      "Please try again later.",
      "The editions.json file could not be loaded."
    );
    return;
  }

  const editions = Array.isArray(data) ? data : data.editions;

  if (!Array.isArray(editions)) {
    stopPage(
      "Invalid Edition Data",
      "Skylark could not read the edition list",
      "The editions.json file may be formatted incorrectly.",
      "Edition data is missing or invalid."
    );
    return;
  }

  const availableEditions = editions
    .filter(isDownloadable)
    .sort((a, b) => editionNumber(a) - editionNumber(b));

  const supportedEdition = availableEditions.find(item => {
    const min = getMinVersion(item);
    const max = getMaxVersion(item);

    return (
      compareVersions(iosVersion, min) >= 0 &&
      compareVersions(iosVersion, max) <= 0
    );
  });

  if (!supportedEdition) {
    stopPage(
      "No Supported Edition",
      "Skylark does not have a supported edition for this iOS version",
      `Detected iOS ${iosVersion.text}`,
      "A matching Skylark edition is not available yet."
    );
    return;
  }

  const supportedNumber = editionNumber(supportedEdition);
  const supportedName = getEditionName(supportedEdition);
  const supportedLink = getEditionLink(supportedEdition);

  const downgradeEditions = availableEditions.filter(item =>
    editionNumber(item) < supportedNumber
  );

  badge.textContent = "Supported Edition Found";
  title.textContent = `${supportedName} is built for your device`;
  version.textContent = `Detected iOS ${iosVersion.text}. You can stay on ${supportedName} or choose an older edition.`;
  setButton(`Get ${supportedName}`, supportedLink);

  if (downgradeEditions.length === 0) {
    selectorWrap.style.display = "none";
    badge.textContent = "No Downgrade Available";
    title.textContent = `${supportedName} is the earliest edition available`;
    version.textContent = `Detected iOS ${iosVersion.text}.`;
    small.textContent = "You are already on the first Skylark edition.";
    error.textContent = "Sorry, no other editions to downgrade to.";
    return;
  }

  selectorWrap.style.display = "block";

  editionSelect.innerHTML = `
    <option value="">Stay on ${supportedName}</option>
  `;

  downgradeEditions
    .slice()
    .reverse()
    .forEach(item => {
      const option = document.createElement("option");
      option.value = getEditionLink(item);
      option.textContent = getEditionName(item);
      option.dataset.edition = getEditionName(item);
      editionSelect.appendChild(option);
    });

  small.innerHTML = `
    Older editions are available, but ${supportedName} is recommended for your device.
  `;

  editionSelect.addEventListener("change", () => {
    const selectedOption = editionSelect.options[editionSelect.selectedIndex];

    if (!editionSelect.value) {
      badge.textContent = "Supported Edition Found";
      title.textContent = `${supportedName} is built for your device`;
      version.textContent = `Detected iOS ${iosVersion.text}. You can stay on ${supportedName} or choose an older edition.`;
      setButton(`Get ${supportedName}`, supportedLink);
      error.textContent = "";
      return;
    }

    badge.textContent = "Older Edition Selected";
    title.textContent = `Downgrade to ${selectedOption.dataset.edition}`;
    version.textContent = `${supportedName} is recommended for iOS ${iosVersion.text}, but ${selectedOption.dataset.edition} is available.`;
    setButton(`Get ${selectedOption.dataset.edition}`, editionSelect.value);

    error.textContent = "Warning: choosing a lower edition may remove features, improvements, or compatibility fixes from newer Skylark editions.";
  });

  console.log("Detected iOS:", iosVersion.text);
  console.log("Supported edition:", supportedName);
}

start();
</script>

</body>
</html>
